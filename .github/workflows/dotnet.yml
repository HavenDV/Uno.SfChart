name: Build, test and publish
on: [ push ]

jobs:
  build-test-publish:
    name: Build, test and publish
    uses: HavenDV/workflows/.github/workflows/dotnet_build-test-publish.yml@main
    with:
      os: windows-latest
      generate-build-number: false
      conventional-commits-publish-conditions: false

  WebAssembly:
    uses: HavenDV/workflows/.github/workflows/dotnet_build-test-publish.yml@main
    with:
      os: windows-latest
      project-path: SampleBrowser/SampleBrowser.SfChart.Wasm
      additional-dotnet-version: 5.0.x
      deploy-web-assembly-path: SampleBrowser/SampleBrowser.SfChart.Wasm/bin/Release/net6.0/dist
      generate-build-number: false
      conventional-commits-publish-conditions: false
      workloads: android ios maccatalyst macos

  nuget-trusted-publish:
    name: NuGet trusted publishing
    needs: build-test-publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tryAGI/workflows/.github/actions/nuget-publish@main
        with:
          user: havendv
          artifact-pattern: nuget-packages-windows-latest
